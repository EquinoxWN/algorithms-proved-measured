[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms-proved-measured"
version = "0.1.0"
description = "Stops 'it passed the sample input' from meaning 'it's correct': classic algorithms in three languages, each with a correctness argument and its real running time measured."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Bugs, security (bandit), modern syntax, imports, naming and test style; `ruff format` owns line length.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and seeded (non-cryptographic) randomness on purpose.
"tests/**" = ["S101", "S311"]
